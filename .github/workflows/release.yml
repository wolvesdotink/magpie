# =============================================================================
# release.yml — build and publish a signed, notarized macOS .dmg + updater
#               manifest to a GitHub Release.
# =============================================================================
#
# TRIGGERS
#   - push to a tag matching `v*.*.*` (e.g. v0.2.0)        → publish release
#   - workflow_dispatch (manual run from the Actions tab)  → publish draft
#
# WHAT IT BUILDS  (Apple Silicon / arm64 only — see "ARCHITECTURE" note below)
#   - Magpie_<version>_arm64.dmg            (signed, notarized, stapled DMG)
#   - Magpie.app.tar.gz + .sig              (updater payload + minisign signature)
#   - latest.json                           (updater manifest consumed by the
#                                            in-app `tauri-plugin-updater`)
#
# WHY NOT TAURI-ACTION
#   Magpie ships llama.cpp + ggml as dynamic libraries (the `dynamic-link`
#   feature on `llama-cpp-2`). Cargo's bundle step does NOT copy these
#   dylibs into the .app, so we run our own scripts/build-macos.sh which:
#     1. builds the .app
#     2. injects libllama*.dylib + libggml*.dylib into Contents/Frameworks
#     3. patches install names + rpaths via install_name_tool
#     4. codesigns with hardened runtime + entitlements
#     5. notarizes (Apple) and staples
#     6. produces the updater .tar.gz + minisign .sig
#     7. builds, codesigns, and notarizes the DMG
#   Tauri-action assumes a vanilla pipeline and would tarball the .app
#   BEFORE step 2, producing an updater payload that crashes on launch.
#
# ARCHITECTURE
#   We currently build arm64 only. macos-latest runners are Apple Silicon,
#   so this is a single native build. Universal binaries are possible but
#   require lipo-ing the per-arch llama/ggml dylibs out of
#   target/{aarch64,x86_64}-apple-darwin/release/ into the universal dir;
#   that work is not done yet. Intel users currently cannot install via
#   the updater — they'll get a 404 on `darwin-x86_64` in latest.json.
#
# DISTRIBUTION URLS  (set up by GitHub automatically once you push a tag)
#   - direct dmg : https://github.com/wolvesdotink/magpie/releases/latest/download/Magpie_<version>_arm64.dmg
#   - latest dmg : https://github.com/wolvesdotink/magpie/releases/latest/download/Magpie.dmg
#                  (we publish an aliased copy named exactly Magpie.dmg so the
#                   marketing site can hard-code one URL forever)
#   - manifest   : https://github.com/wolvesdotink/magpie/releases/latest/download/latest.json
#
# REQUIRED REPO SECRETS  (Settings → Secrets and variables → Actions)
#   Apple code-signing + notarization:
#     APPLE_CERTIFICATE              base64 of your Developer ID .p12
#     APPLE_CERTIFICATE_PASSWORD     password for that .p12
#     APPLE_SIGNING_IDENTITY         "Developer ID Application: <Name> (TEAMID)"
#     APPLE_ID                       your Apple ID email
#     APPLE_PASSWORD                 app-specific password
#                                    (appleid.apple.com → Sign-In and Security
#                                     → App-Specific Passwords)
#     APPLE_TEAM_ID                  10-character team id
#
#   Tauri updater signing (separate from Apple, signs the .tar.gz):
#     TAURI_SIGNING_PRIVATE_KEY            contents of .secrets/updater.key
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD   blank if generated without password
#
#   Generate the updater keypair once with:
#     pnpm tauri signer generate -w .secrets/updater.key
#   Then paste the .secrets/updater.key contents into TAURI_SIGNING_PRIVATE_KEY
#   and the .pub contents into src-tauri/tauri.conf.json's `plugins.updater.pubkey`.
#
#   GITHUB_TOKEN is provided automatically; no setup needed.
# =============================================================================

name: release

on:
  push:
    tags:
      # `v*` (not `v*.*.*`) so we also match prerelease tags like
      # `v0.1.18-beta.1`. Whether the workflow publishes as prerelease or
      # stable is decided by the `tagmeta` step below based on the tag
      # itself, not the trigger glob.
      - 'v*'
  workflow_dispatch:

# Cancel in-flight runs on the same ref so a quick re-tag doesn't queue duplicates.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only publishing-the-release needs `contents: write`. Everything else stays read.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags so the "Generate release notes" step
          # below can `git log <prev-tag>..<this-tag>` and resolve the
          # previous stable tag for the changelog diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 26
        uses: actions/setup-node@v5
        with:
          # pnpm 11 (pinned via packageManager in package.json) require()s the
          # node:sqlite builtin, which only exists in Node >=22.13. Node 20
          # crashes setup-node's `cache: pnpm` store-path probe.
          node-version: 26
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # create-dmg builds the styled installer (background image, custom volume
      # icon, icon positions). Without it, scripts/build-macos.sh errors out at
      # the DMG step. Pre-installed on macos-latest? No — must be installed.
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Set up the signing keychain ourselves so it persists across steps.
      # If we let an action handle the cert (by passing APPLE_CERTIFICATE
      # to a one-shot step), it creates a throwaway keychain that isn't in
      # codesign's search list when later steps run — failing with
      # "The specified item could not be found in the keychain."
      - name: Setup Apple signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_P12="$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_P12"

          # Allow codesign to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Prepend our keychain to the user search list (keep existing entries).
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | sed -E 's/^[[:space:]]*"|"[[:space:]]*$//g' | tr '\n' ' ')

          echo "Available codesigning identities:"
          security find-identity -v -p codesigning

      # Single script handles: cargo build, dylib bundling, install_name fixups,
      # codesign with entitlements, notarize + staple .app, generate + sign
      # updater payload, build DMG, codesign + notarize + staple DMG.
      - name: Build, sign, notarize, generate updater payload
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bash scripts/build-macos.sh --notarize --updater

      # Tags shaped `vX.Y.Z-beta.N` ship to the beta channel; everything
      # else (`vX.Y.Z`) is a stable release. Downstream steps read this
      # output to flip the `prerelease` flag on the GH release and to
      # decide whether to update the rolling `beta-channel` manifest.
      - name: Detect channel from tag
        id: tagmeta
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ "$TAG" == *"-beta."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Build a short changelog from commit subjects between the previous
      # *stable* tag and this one. Both stable and beta releases diff
      # against the last stable so every release surfaces the full delta
      # a user on the previous stable would see if they upgraded — beta
      # testers get the cumulative picture of what's queued for the next
      # stable, not just one beta's incremental change. We skip
      # `chore: bump version` commits since those mark the release itself
      # rather than a change in it. The output is consumed by the Stage
      # step (injected into latest.json) and by the Publish step (used as
      # the GitHub Release body).
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"

          PREV=$(git tag --list 'v*' --sort=-v:refname \
                  | grep -v -- '-beta\.' \
                  | grep -v -Fx "$TAG" \
                  | head -n1 || echo "")

          if [[ -z "$PREV" ]]; then
            BODY="Initial release."
          else
            COMMITS=$(git log "${PREV}..${TAG}" \
                        --no-merges \
                        --pretty=format:'- %s' \
                      | grep -v '^- chore: bump version' || true)
            if [[ -z "$COMMITS" ]]; then
              BODY="Maintenance release."
            else
              COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              BODY=$(printf '%s\n\n**Full changelog:** %s' "$COMMITS" "$COMPARE")
            fi
          fi

          # GITHUB_OUTPUT's heredoc form is the only safe way to pass
          # newline-containing values to later steps.
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "----- generated notes -----"
          echo "$BODY"
          echo "---------------------------"

      # Stage every release asset under dist-release/ so the publish step has
      # one place to look. Also generates latest.json (the updater manifest).
      - name: Stage release assets
        id: stage
        env:
          # Piping the notes via env (rather than inlining the expression in
          # the run script) keeps bash from re-parsing commit-message content
          # — a stray single quote in a future subject would otherwise break
          # the shell string.
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          REPO="${{ github.repository }}"
          ARCH_FILENAME="arm64"

          mkdir -p dist-release

          # Versioned dmg (kept for archive/audit purposes — and what GitHub
          # links to from the assets list on the release page).
          cp "$BUNDLE/dmg/Magpie_${VERSION}_${ARCH_FILENAME}.dmg" \
             "dist-release/Magpie_${VERSION}_${ARCH_FILENAME}.dmg"

          # Stable-named dmg — marketing site / docs hard-code this URL forever.
          cp "$BUNDLE/dmg/Magpie_${VERSION}_${ARCH_FILENAME}.dmg" \
             "dist-release/Magpie.dmg"

          # Updater payload + minisign signature.
          cp "$BUNDLE/macos/Magpie.app.tar.gz"     "dist-release/Magpie.app.tar.gz"
          cp "$BUNDLE/macos/Magpie.app.tar.gz.sig" "dist-release/Magpie.app.tar.gz.sig"

          # Updater manifest. We point at the version-specific download URL
          # (not /latest/) so a client mid-update gets exactly the version
          # the manifest advertised, even if a newer release lands meanwhile.
          # Intel (x86_64) is intentionally omitted: this build is arm64-only.
          SIG=$(cat "$BUNDLE/macos/Magpie.app.tar.gz.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          UPDATER_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Magpie.app.tar.gz"

          # jq (preinstalled on macos-latest) handles JSON escaping for the
          # multi-line `notes` value so newlines, quotes, and backslashes
          # from commit messages can't break the manifest. NOTES is supplied
          # via the step's `env:` block above.
          jq -n \
            --arg version "${VERSION}" \
            --arg notes "$NOTES" \
            --arg pub_date "${PUB_DATE}" \
            --arg sig "${SIG}" \
            --arg url "${UPDATER_URL}" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "darwin-aarch64": { signature: $sig, url: $url }
               }
             }' > dist-release/latest.json

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH_FILENAME}" >> "$GITHUB_OUTPUT"
          ls -la dist-release/

      # Two-step publish for GitHub's Immutable Releases: under that setting,
      # a release becomes immutable the moment it transitions to "published",
      # so any in-flight asset upload after that point fails ("Cannot upload
      # asset ... to an immutable release"). We create the release as a draft
      # so softprops can upload every asset, then flip the draft off in a
      # separate step. workflow_dispatch runs deliberately stop at the draft
      # for human review before publishing.
      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          name: Magpie v${{ steps.stage.outputs.version }}
          draft: true
          prerelease: ${{ steps.tagmeta.outputs.prerelease }}
          fail_on_unmatched_files: true
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            Download `Magpie.dmg` below. **Apple Silicon only** — an x86_64
            / universal build is on the roadmap.

            **First launch on a clean Mac:** the app is signed and notarized,
            so it should open without warnings. If macOS still complains
            (e.g. because the file was downloaded via a non-browser tool),
            right-click the app → Open → Open.

            Existing users: the in-app updater will offer this version on
            the next launch.
          files: |
            dist-release/Magpie_${{ steps.stage.outputs.version }}_${{ steps.stage.outputs.arch }}.dmg
            dist-release/Magpie.dmg
            dist-release/Magpie.app.tar.gz
            dist-release/Magpie.app.tar.gz.sig
            dist-release/latest.json

      # Flip the draft to published. Only runs for tag-push events;
      # workflow_dispatch runs stop at the draft above so a human can review
      # before publishing. Publishing a draft prerelease fires `release.published`
      # (not `release.prereleased`) on any consumer webhooks — there are none in
      # this repo today, but worth knowing if release-event triggers get added.
      - name: Publish draft (tag-push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.stage.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      # Beta channel: publish the manifest to a dedicated `manifests` branch
      # served via raw.githubusercontent.com. Under Immutable Releases we cannot
      # reuse a `beta-channel` release (draft asset URLs use random
      # `untagged-<hash>/` paths; published releases would freeze on first
      # publish), so the rolling pointer has to live outside GitHub Releases.
      #
      # The Rust updater (BETA_ENDPOINT) fetches:
      #   https://raw.githubusercontent.com/<repo>/manifests/beta.json
      #
      # workflow_dispatch runs intentionally skip this push so a human can
      # review the draft release before the beta channel switches over.
      - name: Publish beta manifest to manifests branch
        if: steps.tagmeta.outputs.prerelease == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          git clone --quiet --depth 1 --branch manifests \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$WORK" 2>/dev/null || {
              # Branch doesn't exist yet — bootstrap as orphan.
              git clone --quiet --depth 1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                "$WORK"
              git -C "$WORK" switch --orphan manifests
              git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
            }
          cp dist-release/latest.json "$WORK/beta.json"
          git -C "$WORK" config user.name  "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add beta.json
          if git -C "$WORK" diff --cached --quiet; then
            echo "beta.json unchanged; nothing to push"
          else
            git -C "$WORK" commit -m "release: beta manifest for v${{ steps.stage.outputs.version }}"
            git -C "$WORK" push origin manifests
          fi
