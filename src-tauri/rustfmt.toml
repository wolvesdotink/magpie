# Stable-channel rustfmt options only. Nightly-only options are deliberately
# omitted so `cargo fmt --check` works on the pinned toolchain in CI.
edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
