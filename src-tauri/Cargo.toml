[package]
name = "magpie"
version = "0.1.22"
description = "Open source voice-to-text for macOS"
authors = ["Magpie Contributors"]
edition = "2021"

[lib]
name = "magpie_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# Desktop-only: in-app updater + relaunch.
# tauri-plugin-updater talks to the configured `endpoints` in tauri.conf.json,
# verifies signatures with the public key baked into the binary, and downloads
# + applies updates atomically. tauri-plugin-process gives us `relaunch()`
# so we can restart the app cleanly after the install.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# macOS-only: launch-at-login via the modern SMAppService API (macOS 13+).
# Native ServiceManagement wrapper — single approval notification, plist
# lives inside the app bundle, auto-cleans on uninstall.
[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1"

# Audio
cpal = "0.15"
hound = "3.5"

# Whisper
# metal: route encode+decode through whisper.cpp's Metal GPU backend.
# coreml: load a sibling `<model>-encoder.mlmodelc` package and run the
# encoder on the Apple Neural Engine. Both are no-ops on non-Apple hosts,
# so we keep them on for the only platform we ship to today.
whisper-rs = { version = "0.13", features = ["metal", "coreml"] }

# LLM (self-correction)
# dynamic-link: builds llama.cpp as a separate dylib so its ggml symbols
# don't collide with the ggml symbols from whisper-rs-sys (which are statically
# linked). Without this, 472+ duplicate ggml_* symbols cause the linker to
# resolve one version for both crates, producing memory corruption at runtime.
llama-cpp-2 = { version = "0.1.141", features = ["dynamic-link"] }

# Text output
arboard = "3"
enigo = { version = "0.2", features = ["serde"] }

# macOS native
cocoa = "0.26"
objc = "0.2"
block = "0.1"
core-graphics = "0.24"
core-foundation = "0.10"

# Async / networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"

# Used to unpack `*-encoder.mlmodelc.zip` packages downloaded alongside
# whisper.cpp GGML weights so the CoreML encoder runs on the ANE.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
log = "0.4"
anyhow = "1.0"
thiserror = "2"
regex = "1"
num_cpus = "1"
semver = "1"

# parking_lot replaces std::sync::Mutex / RwLock with implementations that
# do not poison on panic, lock faster on contention, and offer RwLock with
# the same ergonomics as Mutex. Adopted in Phase 2 of the architecture
# refactor; see `state::AppState` for the lock-ordering protocol.
parking_lot = "0.12"

# Structured logging. Adopted in Phase 0 of the architecture refactor and
# used by all new code. `tracing-log` keeps the existing `log::*` calls
# (and ecosystem crates like whisper-rs / llama-cpp-2 that emit via `log`)
# routed into the same subscriber, so we do not need a flag-day cutover.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"

[dev-dependencies]
# Snapshot testing for postprocess / migrations / event-payload shapes.
insta = { version = "1.41", features = ["json", "yaml"] }
# Property-style assertions used by some of the early test seams.
pretty_assertions = "1.4"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
