<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!--
    Magpie DMG installer background.
    660x400, "Warm Studio" palette (matches src/styles/global.css).
    Finder draws app & Applications icons on top at (180,170) and (480,170).
  -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131211"/>
      <stop offset="100%" stop-color="#1b1917"/>
    </linearGradient>

    <linearGradient id="topHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8af47" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e8af47" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8af47" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="wellGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#e8af47" stop-opacity="0.10"/>
      <stop offset="55%"  stop-color="#e8af47" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#e8af47" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8af47"/>
      <stop offset="100%" stop-color="#b8862e"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.93
                             0 0 0 0 0.91
                             0 0 0 0 0.89
                             0 0 0 0.05 0"/>
    </filter>

    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e8af47" fill-opacity="0.85"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="660" height="400" fill="url(#canvas)"/>
  <rect width="660" height="400" filter="url(#grain)"/>
  <rect width="660" height="1.5" fill="url(#topHighlight)"/>

  <!-- Wordmark -->
  <g transform="translate(36, 38)">
    <rect x="0" y="0" width="26" height="26" rx="6" fill="url(#goldFill)"/>
    <text x="13" y="19.5"
          font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
          font-size="17" font-weight="700"
          fill="#131211" text-anchor="middle">M</text>

    <text x="36" y="17"
          font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
          font-size="18" font-weight="600"
          fill="#ede8e2" letter-spacing="-0.2">Magpie</text>

    <text x="36" y="33"
          font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
          font-size="10.5" font-weight="400"
          fill="#9e978f" letter-spacing="0.4">Open-source, local-first voice-to-text</text>
  </g>

  <!-- Icon-well glows: hint that "icons live here" -->
  <ellipse cx="180" cy="170" rx="92" ry="84" fill="url(#wellGlow)"/>
  <ellipse cx="480" cy="170" rx="92" ry="84" fill="url(#wellGlow)"/>

  <!-- Drag instruction -->
  <text x="330" y="128"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="9" font-weight="600"
        fill="#e8af47" fill-opacity="0.65"
        letter-spacing="3.5" text-anchor="middle">DRAG TO INSTALL</text>

  <path d="M 268 170 Q 330 138 392 170"
        fill="none" stroke="#e8af47" stroke-width="1.5"
        stroke-linecap="round" stroke-opacity="0.7"
        marker-end="url(#arrowHead)"/>

  <!-- Feature ribbon -->
  <g>
    <line x1="36" y1="324" x2="624" y2="324" stroke="#332f2b" stroke-width="1"/>

    <!-- Tile 1: HOLD TO DICTATE (microphone) -->
    <g transform="translate(110, 348)">
      <g transform="translate(-9, -19)" fill="none"
         stroke="#e8af47" stroke-opacity="0.75"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="0" width="6" height="10" rx="3"
              fill="#e8af47" fill-opacity="0.75" stroke="none"/>
        <path d="M 2 6 v 1.5 a 7 7 0 0 0 14 0 v -1.5"/>
        <line x1="9" y1="14.5" x2="9" y2="18"/>
        <line x1="5" y1="18" x2="13" y2="18"/>
      </g>
      <text x="0" y="14"
            font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
            font-size="8.5" font-weight="600"
            fill="#9e978f" letter-spacing="2.4" text-anchor="middle">HOLD TO DICTATE</text>
    </g>

    <line x1="220" y1="334" x2="220" y2="372" stroke="#332f2b" stroke-width="1"/>

    <!-- Tile 2: ON-DEVICE ONLY (chip) -->
    <g transform="translate(330, 348)">
      <g transform="translate(-9, -19)" fill="none"
         stroke="#e8af47" stroke-opacity="0.75"
         stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="3" y="3" width="12" height="12" rx="1.6"/>
        <rect x="6.5" y="6.5" width="5" height="5"
              fill="#e8af47" fill-opacity="0.75" stroke="none"/>
        <line x1="0"  y1="6.5"  x2="3"  y2="6.5"/>
        <line x1="0"  y1="11.5" x2="3"  y2="11.5"/>
        <line x1="15" y1="6.5"  x2="18" y2="6.5"/>
        <line x1="15" y1="11.5" x2="18" y2="11.5"/>
        <line x1="6.5"  y1="0"  x2="6.5"  y2="3"/>
        <line x1="11.5" y1="0"  x2="11.5" y2="3"/>
        <line x1="6.5"  y1="15" x2="6.5"  y2="18"/>
        <line x1="11.5" y1="15" x2="11.5" y2="18"/>
      </g>
      <text x="0" y="14"
            font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
            font-size="8.5" font-weight="600"
            fill="#9e978f" letter-spacing="2.4" text-anchor="middle">ON-DEVICE ONLY</text>
    </g>

    <line x1="440" y1="334" x2="440" y2="372" stroke="#332f2b" stroke-width="1"/>

    <!-- Tile 3: NO TELEMETRY (crossed cloud) -->
    <g transform="translate(550, 348)">
      <g transform="translate(-10, -17)" fill="none"
         stroke="#e8af47" stroke-opacity="0.75"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 12 a 3.5 3.5 0 0 1 -1 -6.8 a 4.6 4.6 0 0 1 8.8 -1.7 a 3.4 3.4 0 0 1 1.2 6.5 z"/>
        <line x1="0.5" y1="0.5" x2="20" y2="14.5" stroke-opacity="0.95"/>
      </g>
      <text x="0" y="14"
            font-family="'Plus Jakarta Sans', 'Helvetica Neue', Helvetica, sans-serif"
            font-size="8.5" font-weight="600"
            fill="#9e978f" letter-spacing="2.4" text-anchor="middle">NO TELEMETRY</text>
    </g>
  </g>
</svg>
